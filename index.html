<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族のことを整理するAI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 18px #00000010}
header{padding:18px 20px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;background:#fff;z-index:5}
h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:#6b7280}
main{padding:20px}.home-title{font-size:25px;font-weight:700;margin:10px 0 18px}
button{border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer}
button.primary{background:#111827;color:#fff;border-color:#111827}.buttons{display:flex;gap:10px;flex-wrap:wrap}
textarea,input{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:13px;font:inherit}
textarea{min-height:100px;resize:vertical}.card{border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:12px 0}
.section{margin:22px 0}.label{font-size:12px;color:#6b7280;margin-bottom:5px}.value{font-weight:600}
.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f0f2f5;font-size:12px;margin-right:5px}
.notice{background:#f8fafc;border-left:4px solid #6b7280;padding:12px;border-radius:8px}
#back{position:fixed;right:16px;bottom:16px;z-index:10}
.hidden{display:none}.muted{color:#6b7280}.danger{border-left-color:#b91c1c;background:#fef2f2}
.small{font-size:13px}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>家族のことを整理するAI</h1>
  <div class="sub">父・母の予定、記録、やることを一緒に整理します</div>
</header>
<main id="app"></main>
</div>
<button id="back" onclick="home()">最初に戻る</button>

<script>
const initial={
 records:[
  {date:"2026-09-01",target:"父",tag:"病院・医療",text:"倉敷中央病院で検査結果の説明。消化器内科・石原裕基先生。"},
  {date:"2026-08-24",target:"父",tag:"病院・医療",text:"倉敷中央病院で検査。朝の服薬について事前指示あり。"},
  {date:"2026-09-02",target:"父と母",tag:"介護",text:"早島町地域包括支援センターへ連絡。15:30 オノ ケイコさんが訪問。介護保険申請書を提出。"},
  {date:"2026-09-04",target:"父と母",tag:"介護",text:"14:30 ウノさんが訪問。「視察」。詳細は未確認。"}
 ],
 appointments:[
  {date:"2026-09-16",time:"09:00",target:"母",hospital:"竜操整形外科病院",purpose:"受診",status:"予定"},
  {date:"2026-10-05",time:"10:30",target:"母",hospital:"倉敷中央病院",purpose:"歯科 術前外来",status:"予定"},
  {date:"2026-10-07",time:"09:00",target:"母",hospital:"倉敷中央病院",purpose:"外科系検査",status:"予定"},
  {date:"2026-10-15",time:"08:30",target:"母",hospital:"倉敷中央病院",purpose:"麻酔科 術前外来",status:"予定"},
  {date:"2026-10-15",time:"10:15",target:"母",hospital:"倉敷中央病院",purpose:"入院説明",status:"予定"}
 ],
 todos:[
  {text:"包括支援センターの9/2・9/4の訪問内容を詳しく記録する",target:"父と母",status:"未着手",deadline:""},
  {text:"父の7/21の倉敷中央病院受診内容を確認する",target:"父",status:"確認待ち",deadline:""},
  {text:"父の7/28の倉敷中央病院受診内容を確認する",target:"父",status:"確認待ち",deadline:""},
  {text:"母の退院日を確認する",target:"母",status:"確認待ち",deadline:""}
 ]
};
let state=JSON.parse(localStorage.getItem("carebot")||"null")||initial;
function save(){localStorage.setItem("carebot",JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function home(){
 document.getElementById("app").innerHTML=`
 <div class="home-title">何をしたいですか？</div>
 <div class="buttons">
  <button class="primary" onclick="recordFlow()">記録する</button>
  <button onclick="confirmFlow()">確認する</button>
 </div>
 <div class="section">
  <div class="label">自由に話してください</div>
  <textarea id="free" placeholder="例：父の病院のことを記録したい&#10;例：9月の予定を見せて&#10;例：まだ終わっていないことは？"></textarea>
  <button class="primary" style="margin-top:10px" onclick="freeInput()">送る</button>
 </div>
 <div class="section card">
  <div class="label">今確認すること</div>
  <div class="item">母の退院日 <span class="badge">確認待ち</span></div>
  <div class="item">9月16日 9:00 竜操整形外科病院</div>
 </div>`;
}
function recordFlow(){
 document.getElementById("app").innerHTML=`
 <h2>どんな内容ですか？</h2>
 <textarea id="recordText" placeholder="そのまま話してください。例：昨日、父が薬を飲んだあと5分くらいでまた飲んだ"></textarea>
 <div class="buttons" style="margin-top:10px"><button class="primary" onclick="structureRecord()">次へ</button></div>`;
}
function structureRecord(){
 const text=document.getElementById("recordText").value.trim();
 if(!text){alert("内容を入力してください");return}
 window.pending={text,date:new Date().toISOString().slice(0,10),target:"",tag:"その他"};
 document.getElementById("app").innerHTML=`
 <h2>誰のことですか？</h2><p class="muted">AIが整理した内容：${esc(text)}</p>
 <div class="buttons">
 ${["父","母","父と母","その他"].map(x=>`<button onclick="pickTarget('${x}')">${x}</button>`).join("")}
 </div>`;
}
function pickTarget(x){
 window.pending.target=x;
 document.getElementById("app").innerHTML=`
 <h2>いつのことですか？</h2>
 <div class="buttons">
  <button onclick="pickDate('今日')">今日</button><button onclick="pickDate('昨日')">昨日</button><button onclick="pickDate('その他')">その他（選択）</button>
 </div>`;
}
function pickDate(x){
 let d=new Date(); if(x==="昨日")d.setDate(d.getDate()-1);
 window.pending.date=x==="その他"?"":d.toISOString().slice(0,10);
 if(x==="その他"){
  document.getElementById("app").innerHTML=`<h2>日付を選んでください</h2><input type="date" id="customDate"><button class="primary" style="margin-top:10px" onclick="customDate()">次へ</button>`;
 }else tagStep();
}
function customDate(){let d=document.getElementById("customDate").value;if(!d)return;window.pending.date=d;tagStep()}
function tagStep(){
 const tags=["病院・医療","介護","薬・服薬","気になる行動","その他"];
 document.getElementById("app").innerHTML=`<h2>カテゴリを確認してください</h2><div class="buttons">${tags.map(t=>`<button onclick="confirmRecord('${t}')">${t}</button>`).join("")}</div>`;
}
function confirmRecord(tag){
 window.pending.tag=tag;
 document.getElementById("app").innerHTML=`
 <h2>この内容で記録しますか？</h2>
 <div class="card">
 <div class="label">日時</div><div>${esc(window.pending.date||"不明")}</div>
 <div class="label" style="margin-top:10px">対象</div><div>${esc(window.pending.target)}</div>
 <div class="label" style="margin-top:10px">カテゴリ</div><div>${esc(tag)}</div>
 <div class="label" style="margin-top:10px">内容</div><div>${esc(window.pending.text)}</div>
 </div>
 <div class="buttons"><button class="primary" onclick="saveRecord()">記録する</button><button onclick="recordFlow()">修正する</button></div>`;
}
function saveRecord(){
 state.records.unshift({date:window.pending.date,target:window.pending.target,tag:window.pending.tag,text:window.pending.text});
 save(); window.pending=null;
 document.getElementById("app").innerHTML=`<div class="notice"><strong>記録しました。</strong></div><div class="card">関連する予定やTo Doがあれば、ここから確認できます。</div>`;
}
function confirmFlow(){
 document.getElementById("app").innerHTML=`
 <h2>どうやって確認しますか？</h2>
 <div class="buttons">
  <button class="primary" onclick="askFlow()">AIの質問に答える</button>
  <button onclick="showAll()">自分の言葉で説明する</button>
 </div>`;
}
function askFlow(){
 document.getElementById("app").innerHTML=`
 <h2>何を確認したいですか？</h2>
 <div class="buttons">
  <button onclick="showAppts()">予定・予約</button><button onclick="showTodos()">やること</button><button onclick="showRecords()">記録</button><button onclick="askFree()">その他</button>
 </div>`;
}
function askFree(){
 document.getElementById("app").innerHTML=`<h2>何を知りたいですか？</h2><textarea id="q" placeholder="例：父の薬について今まで何があった？"></textarea><button class="primary" style="margin-top:10px" onclick="freeInput(true)">確認する</button>`;
}
function showAppts(){
 let a=[...state.appointments].sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
 document.getElementById("app").innerHTML=`<h2>これからの予定</h2>${a.map(x=>`<div class="card"><b>${x.date} ${x.time}</b><br>${x.target}　${x.hospital}<br><span class="muted">${x.purpose}</span></div>`).join("")}`;
}
function showTodos(){
 const active=state.todos.filter(x=>x.status!=="完了");
 document.getElementById("app").innerHTML=`<h2>やること</h2><div class="section"><b>今確認すること</b>${active.map((x,i)=>`<div class="item">${esc(x.text)} <span class="badge">${x.status}</span></div>`).join("")}</div>`;
}
function showRecords(){
 document.getElementById("app").innerHTML=`<h2>記録</h2>${state.records.slice(0,20).map(x=>`<div class="card"><b>${x.date}</b>　${x.target}　<span class="badge">${x.tag}</span><br>${esc(x.text)}</div>`).join("")}`;
}
function showAll(){
 showDashboard();
}
function showDashboard(){
 document.getElementById("app").innerHTML=`
 <h2>現在の状況</h2>
 <div class="card"><b>近日の予定</b><div class="item">9/16 9:00　母　竜操整形外科病院</div></div>
 <div class="card"><b>確認が必要なこと</b>${state.todos.filter(x=>x.status==="確認待ち").map(x=>`<div class="item">${esc(x.text)}</div>`).join("")}</div>
 <div class="card"><b>AIからの提案</b><div class="notice">母の退院日が未定です。退院後の予定に影響するため、確認しておくとよさそうです。</div></div>`;
}
function freeInput(fromQ=false){
 const el=document.getElementById(fromQ?"q":"free"); const q=(el?.value||"").trim();
 if(!q)return;
 if(/予定|予約/.test(q))return showAppts();
 if(/やること|todo|To Do|終わってない|未完了/.test(q))return showTodos();
 if(/記録|今まで|経過/.test(q))return showRecords();
 document.getElementById("app").innerHTML=`<div class="notice">今のMVPでは、入力内容をAIで分類する部分を簡易判定しています。実運用版ではここをChatGPT APIに接続し、自然言語で意図を判定して必要な質問だけを返します。</div><div class="card"><b>受け取った内容</b><br>${esc(q)}</div>`;
}
home();
</script>
</body>
</html>
